controller_node:
  ros__parameters:
    map_frame: world
    vehicle_frame: OurCar/INS
    enable_motion: true
    control_rate: 20.0

    # Standalone defaults. full_system.launch.py overrides both values from
    # the same shared vehicle model used by trajectory_generator.
    wheelbase: 2.63
    lookahead_base: 3.0
    lookahead_speed_gain: 0.5
    lookahead_min: 2.0
    lookahead_max: 7.0
    minimum_forward_distance: 0.2

    # Match the 14 m/s straight-route and trajectory ceilings.
    maximum_target_speed: 14.0
    normalize_steering: true
    steering_sign: -1.0
    maximum_steering_angle: 0.52
    maximum_steering_rate: 2.0

    speed_kp: 0.35
    speed_ki: 0.05
    speed_kd: 0.02
    speed_integral_limit: 2.0
    speed_error_deadband: 0.05
    # Half throttle plateaued near 4.56 m/s even with a 14 m/s target. Use a
    # moderate increase while route, decision, and controller limits retain
    # authority over traffic-light and event speeds.
    maximum_throttle: 0.70
    maximum_brake: 1.0
    safe_stop_brake: 1.0

    trajectory_timeout: 1.0
    decision_timeout: 0.75
    # Unity serializes state and sensor streams on the same TCP connection.
    # The 2026-08-01 full-stack diagnostic bag measured a 2.5905 s maximum
    # twist gap under YOLO/mapping load; retain a bounded 0.1595 s margin.
    twist_timeout: 2.75
