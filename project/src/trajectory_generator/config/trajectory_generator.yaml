trajectory_generator_node:
  ros__parameters:
    map_frame: world
    vehicle_frame: OurCar/INS
    update_rate: 10.0
    path_resolution: 1.0
    min_target_distance: 0.5
    smoothing_strength: 0.25
    max_curvature: 2.0
    max_yaw_step: 1.1
    max_start_distance: 5.0
    max_spline_deviation: 2.5
    use_waypoint_yaw: true
    continuity_blend_distance: 5.0
    continuity_candidate_weight: 0.5
    max_continuity_deviation: 2.0
    default_speed: 2.0
    # Straight-route waypoints are capped at 14 m/s (50.4 km/h).
    max_speed: 14.0
    # Raise the generic intersection cap while the tighter 2 m/s turn limits
    # in route_map.yaml continue to take precedence.
    slow_speed: 3.0
    stop_speed: 0.0
